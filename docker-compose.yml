version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vetclinic_db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: vetclinic
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetclinic_backend
    environment:
      FLASK_ENV: development
      FLASK_APP: app.py
      PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: vetclinic
      DB_USER: root
      DB_PASSWORD: ""
      SECRET_KEY: dev-secret-key
      JWT_SECRET_KEY: jwt-dev-secret-key
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python app.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vetclinic_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
